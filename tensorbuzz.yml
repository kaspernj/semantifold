before_install:
  - curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://nodejs.org/dist/v24.18.1/node-v24.18.1-linux-x64.tar.xz --output /tmp/node-v24.18.1-linux-x64.tar.xz
  - sudo tar -xJf /tmp/node-v24.18.1-linux-x64.tar.xz -C /usr/local --strip-components=1
  - sudo apt-get update
  - sudo apt-get install --yes --no-install-recommends php-cli ruby default-jdk-headless
  - node --version
  - npm --version
  - php --version
  - ruby --version
  - javac -version
  - java -version
before_script:
  - npm ci
environment:
  NODE_ENV: test
builds:
  quality:
    name: Quality and package
    script:
      - npm run lint
      - npm run typecheck
      - npm run build
      - npm audit --audit-level=high
      - npm ls --omit=dev --all
      - npm pack --dry-run --json
  end_to_end:
    name: Five-language end-to-end tests
    script:
      - npm test
