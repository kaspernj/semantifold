before_install:
  - curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://nodejs.org/dist/v24.18.1/node-v24.18.1-linux-x64.tar.xz --output /tmp/node-v24.18.1-linux-x64.tar.xz
  - sudo tar -xJf /tmp/node-v24.18.1-linux-x64.tar.xz -C /usr/local --strip-components=1
  - curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://go.dev/dl/go1.26.7.linux-amd64.tar.gz --output /tmp/go1.26.7.linux-amd64.tar.gz
  - printf '%s  %s\n' 'ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca' '/tmp/go1.26.7.linux-amd64.tar.gz' | sha256sum --check -
  - sudo rm -rf /usr/local/go
  - sudo tar -xzf /tmp/go1.26.7.linux-amd64.tar.gz -C /usr/local
  - sudo ln --symbolic --force /usr/local/go/bin/go /usr/local/bin/go
  - sudo ln --symbolic --force /usr/local/go/bin/gofmt /usr/local/bin/gofmt
  - sudo apt-get update
  - sudo apt-get install --yes --no-install-recommends php-cli python3 ruby default-jdk-headless dotnet-sdk-10.0 ca-certificates curl gnupg
  - curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/semantifold-llvm.asc
  - printf '%s  %s\n' '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d' '/tmp/semantifold-llvm.asc' | sha256sum --check -
  - sudo install -D -m 0644 /tmp/semantifold-llvm.asc /etc/apt/keyrings/llvm.asc
  - printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/semantifold-llvm21.list
  - sudo apt-get update
  - sudo apt-get install --yes --no-install-recommends clang-21=1:21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70 libclang-rt-21-dev=1:21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70
  - node --version
  - npm --version
  - clang-21 --version
  - clang-21 -dumpmachine
  - clang-21 -print-resource-dir
  - test "$(clang-21 -dumpversion)" = "21.1.8"
  - test "$(clang-21 -dumpmachine)" = "x86_64-pc-linux-gnu"
  - test -r "$(clang-21 -print-resource-dir)/lib/linux/libclang_rt.asan-x86_64.a"
  - test -r "$(clang-21 -print-resource-dir)/lib/linux/libclang_rt.ubsan_standalone-x86_64.a"
  - php --version
  - python3 --version
  - ruby --version
  - javac -version
  - java -version
  - dotnet --info
  - test "$(dotnet --version | cut -d. -f1)" = "10"
  - go version
  - go env GOVERSION GOOS GOARCH GOROOT
  - test "$(go env GOVERSION)" = "go1.26.7"
  - test "$(go env GOVERSION | cut -d. -f1,2)" = "go1.26"
  - test "$(go env GOOS)" = "linux"
  - test "$(go env GOARCH)" = "amd64"
  - test -n "$(go env GOROOT)"
  - test -x "$(go env GOROOT)/bin/gofmt"
  - test "$(readlink -f "$(command -v gofmt)")" = "$(readlink -f "$(go env GOROOT)/bin/gofmt")"
before_script:
  - npm ci
environment:
  NODE_ENV: test
  SEMANTIFOLD_NODE: /usr/local/bin/node
  SEMANTIFOLD_PYTHON: /usr/bin/python3
  SEMANTIFOLD_DOTNET: /usr/bin/dotnet
  SEMANTIFOLD_GO: /usr/local/bin/go
  SEMANTIFOLD_CLANG: /usr/bin/clang-21
builds:
  quality:
    name: Quality and package
    script:
      - npm run lint
      - npm run typecheck
      - npm run build
      - npm audit --audit-level=high
      - npm ls --omit=dev --all
      - npm ls --all
      - npm pack --dry-run --json
  end_to_end:
    name: Nine-language end-to-end tests with C O0/O2 and sanitizers
    script:
      - LANG=C.UTF-8 LC_ALL=C.UTF-8 npm test
