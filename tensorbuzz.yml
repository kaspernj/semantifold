before_install:
  - curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://nodejs.org/dist/v24.18.1/node-v24.18.1-linux-x64.tar.xz --output /tmp/node-v24.18.1-linux-x64.tar.xz
  - sudo tar -xJf /tmp/node-v24.18.1-linux-x64.tar.xz -C /usr/local --strip-components=1
  - curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://go.dev/dl/go1.26.7.linux-amd64.tar.gz --output /tmp/go1.26.7.linux-amd64.tar.gz
  - printf '%s  %s\n' 'ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca' '/tmp/go1.26.7.linux-amd64.tar.gz' | sha256sum --check -
  - sudo rm -rf /usr/local/go
  - sudo tar -xzf /tmp/go1.26.7.linux-amd64.tar.gz -C /usr/local
  - sudo ln --symbolic --force /usr/local/go/bin/go /usr/local/bin/go
  - sudo ln --symbolic --force /usr/local/go/bin/gofmt /usr/local/bin/gofmt
  - sudo apt-get update
  - sudo apt-get install --yes --no-install-recommends php-cli python3 ruby openjdk-25-jdk-headless=25.0.4+7-1~24.04 dotnet-sdk-10.0 ca-certificates curl gnupg g++-13 xz-utils build-essential libncurses6 libxml2-dev
  - |
    sudo sh -eu <<'KOTLIN_TOOLCHAIN'
    KOTLIN_ROOT=/tmp/semantifold-kotlin
    KOTLIN_ARCHIVE="$KOTLIN_ROOT/kotlin-compiler-2.4.20.zip"
    install -d -m 0755 "$KOTLIN_ROOT"
    curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-compiler-2.4.20.zip --output "$KOTLIN_ARCHIVE"
    printf '%s  %s\n' '59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7' "$KOTLIN_ARCHIVE" | sha256sum --check -
    cd "$KOTLIN_ROOT"
    jar -xf "$KOTLIN_ARCHIVE"
    mv kotlinc /opt/kotlinc
    test "$(/opt/kotlinc/bin/kotlinc -version 2>&1)" = 'info: kotlinc-jvm 2.4.20 (JRE 25.0.4+7-1-24.04-Ubuntu)'
    test "$(java -version 2>&1 | sed -n '1p')" = 'openjdk version "25.0.4" 2026-07-21'
    rm -rf "$KOTLIN_ROOT"
    KOTLIN_TOOLCHAIN
  - curl --fail --silent --show-error --location https://archive.ubuntu.com/ubuntu/pool/universe/w/wabt/wabt_1.0.36+dfsg+~cs1.0.36-2ubuntu1_amd64.deb --output /tmp/wabt_1.0.36+dfsg+~cs1.0.36-2ubuntu1_amd64.deb
  - printf '%s  %s\n' 'febaa4935e2982d83b21c75938773f226fa8bf22145f6a3bee25da9e98b0273b' '/tmp/wabt_1.0.36+dfsg+~cs1.0.36-2ubuntu1_amd64.deb' | sha256sum --check -
  - curl --fail --silent --show-error --location https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_152.0.7977.82-1_amd64.deb --output /tmp/google-chrome-stable_152.0.7977.82-1_amd64.deb
  - printf '%s  %s\n' '4d25e4a028c78a7ae910683551c2f234792cc5595e7e3e34939f599342ada446' '/tmp/google-chrome-stable_152.0.7977.82-1_amd64.deb' | sha256sum --check -
  - sudo apt-get install --yes --no-install-recommends /tmp/wabt_1.0.36+dfsg+~cs1.0.36-2ubuntu1_amd64.deb /tmp/google-chrome-stable_152.0.7977.82-1_amd64.deb
  - sudo ln --symbolic /usr/bin/google-chrome-stable /usr/local/bin/chromium
  - |
    sudo sh -eu <<'RUST_TOOLCHAIN'
    test "$(dpkg --print-architecture)" = "amd64"
    install -d -m 0755 /tmp/semantifold-rust
    cd /tmp/semantifold-rust
    curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://static.rust-lang.org/dist/2026-09-03/rustc-1.98.1-x86_64-unknown-linux-gnu.tar.xz --output rustc-1.98.1-x86_64-unknown-linux-gnu.tar.xz
    echo 'e974f036b28565f37c0f3bd92ddefa809bee16c04f9dcf07b9ed96e05aaaf7c4  rustc-1.98.1-x86_64-unknown-linux-gnu.tar.xz' | sha256sum --check -
    curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://static.rust-lang.org/dist/2026-09-03/rust-std-1.98.1-x86_64-unknown-linux-gnu.tar.xz --output rust-std-1.98.1-x86_64-unknown-linux-gnu.tar.xz
    echo 'fa3ff450172a16c026944030230c5069947af93c728d9179971d44e5e0cfb561  rust-std-1.98.1-x86_64-unknown-linux-gnu.tar.xz' | sha256sum --check -
    curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors https://static.rust-lang.org/dist/2026-09-03/cargo-1.98.1-x86_64-unknown-linux-gnu.tar.xz --output cargo-1.98.1-x86_64-unknown-linux-gnu.tar.xz
    echo 'ea1de9f9e23107d97ee2b41a72c552f34064a593da503789218387aee59f3ba4  cargo-1.98.1-x86_64-unknown-linux-gnu.tar.xz' | sha256sum --check -
    for component in rustc rust-std cargo; do
      tar -xJf "${component}-1.98.1-x86_64-unknown-linux-gnu.tar.xz"
      "./${component}-1.98.1-x86_64-unknown-linux-gnu/install.sh" --prefix=/opt/rust-1.98.1 --disable-ldconfig
    done
    ln --symbolic /opt/rust-1.98.1/bin/rustc /usr/local/bin/rustc
    ln --symbolic /opt/rust-1.98.1/bin/cargo /usr/local/bin/cargo
    rustc --version --verbose
    cargo --version --verbose
    test "$(rustc --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
    test "$(cargo --version)" = 'cargo 1.98.1 (797e8a9bc 2026-08-05)'
    test "$(rustc --print sysroot)" = '/opt/rust-1.98.1'
    test "$(rustc --version --verbose | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
    test "$(cargo --version --verbose | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
    test "$(rustc --version --verbose | sed -n 's/^commit-hash: //p')" = '48a229ceaefd4985c50990b14116b6d856af0985'
    test "$(cargo --version --verbose | sed -n 's/^commit-hash: //p')" = '797e8a9bca276c1c9f9f738d2a20f484fa4eea9d'
    rm -rf /tmp/semantifold-rust
    RUST_TOOLCHAIN
  - |
    sudo sh -eu <<'SWIFT_TOOLCHAIN'
    SWIFT_KEY=/tmp/release-key-swift-6.x.asc
    SWIFT_ARCHIVE=/tmp/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
    SWIFT_SIGNATURE="$SWIFT_ARCHIVE.sig"
    SWIFT_PROBE=/tmp/semantifold-swift-smoke.swift
    SWIFT_DEBUG=/tmp/semantifold-swift-smoke-debug
    SWIFT_OPTIMIZED=/tmp/semantifold-swift-smoke-optimized
    GNUPGHOME="$(mktemp -d)"
    export GNUPGHOME
    trap 'rm -rf "$GNUPGHOME" "$SWIFT_KEY" "$SWIFT_ARCHIVE" "$SWIFT_SIGNATURE" "$SWIFT_PROBE" "$SWIFT_DEBUG" "$SWIFT_OPTIMIZED"' EXIT
    curl --fail --silent --show-error --location --compressed https://swift.org/keys/release-key-swift-6.x.asc --output "$SWIFT_KEY"
    printf '%s  %s\n' 'e8090b06c98b598e968193749db403c06f40c4186771ed87d916081c43de2f5b' "$SWIFT_KEY" | sha256sum --check -
    gpg --batch --homedir "$GNUPGHOME" --import "$SWIFT_KEY"
    test "$(gpg --batch --homedir "$GNUPGHOME" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }' | wc -l)" = 1
    test "$(gpg --batch --homedir "$GNUPGHOME" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }')" = 52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
    curl --fail --silent --show-error --location https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz --output "$SWIFT_ARCHIVE"
    curl --fail --silent --show-error --location https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz.sig --output "$SWIFT_SIGNATURE"
    gpg --batch --homedir "$GNUPGHOME" --verify "$SWIFT_SIGNATURE" "$SWIFT_ARCHIVE"
    printf '%s  %s\n' 'da8272a5fddccd65b1529ed0e52e04526e2eadd4237d58d6220efeb973c6cd19' "$SWIFT_ARCHIVE" | sha256sum --check -
    tar -xzf "$SWIFT_ARCHIVE" -C /opt
    export PATH="/opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    test "$(command -v clang)" = "/opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/clang"
    /opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc --version
    test "$(/opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc --version | sed -n '1p')" = 'Swift version 6.3.3 (swift-6.3.3-RELEASE)'
    test "$(/opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc --version | sed -n '2p')" = 'Target: x86_64-unknown-linux-gnu'
    printf '%s\n' 'print(5)' > "$SWIFT_PROBE"
    /opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc -warnings-as-errors "$SWIFT_PROBE" -o "$SWIFT_DEBUG"
    test "$("$SWIFT_DEBUG")" = 5
    /opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc -warnings-as-errors -O "$SWIFT_PROBE" -o "$SWIFT_OPTIMIZED"
    test "$("$SWIFT_OPTIMIZED")" = 5
    SWIFT_TOOLCHAIN
  - curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/semantifold-llvm.asc
  - printf '%s  %s\n' '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d' '/tmp/semantifold-llvm.asc' | sha256sum --check -
  - sudo install -D -m 0644 /tmp/semantifold-llvm.asc /etc/apt/keyrings/llvm.asc
  - printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/semantifold-llvm21.list
  - sudo apt-get update
  - sudo apt-get install --yes --no-install-recommends clang-21=1:21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70 libclang-rt-21-dev=1:21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70
  - node --version
  - npm --version
  - clang-21 --version
  - clang++-21 --version
  - test "$(clang++-21 -dumpversion)" = "21.1.8"
  - test -r "$(clang++-21 -print-file-name=libstdc++.so)"
  - dpkg-query -W libstdc++-13-dev
  - clang-21 -dumpmachine
  - clang-21 -print-resource-dir
  - test "$(clang-21 -dumpversion)" = "21.1.8"
  - test "$(clang-21 -dumpmachine)" = "x86_64-pc-linux-gnu"
  - test -r "$(clang-21 -print-resource-dir)/lib/linux/libclang_rt.asan-x86_64.a"
  - test -r "$(clang-21 -print-resource-dir)/lib/linux/libclang_rt.ubsan_standalone-x86_64.a"
  - php --version
  - python3 --version
  - ruby --version
  - javac -version
  - java -version
  - dotnet --info
  - test "$(dotnet --version | cut -d. -f1)" = "10"
  - go version
  - go env GOVERSION GOOS GOARCH GOROOT
  - test "$(go env GOVERSION)" = "go1.26.7"
  - test "$(go env GOVERSION | cut -d. -f1,2)" = "go1.26"
  - test "$(go env GOOS)" = "linux"
  - test "$(go env GOARCH)" = "amd64"
  - test -n "$(go env GOROOT)"
  - test -x "$(go env GOROOT)/bin/gofmt"
  - test "$(readlink -f "$(command -v gofmt)")" = "$(readlink -f "$(go env GOROOT)/bin/gofmt")"
  - wasm-validate --version
  - test "$(wasm-validate --version)" = "1.0.36"
  - chromium --version
  - test "$(chromium --version | sed 's/ $//')" = "Google Chrome 152.0.7977.82"
  - chromium --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /tmp/semantifold-chromium-probe.html
before_script:
  - npm ci
environment:
  NODE_ENV: test
  SEMANTIFOLD_NODE: /usr/local/bin/node
  SEMANTIFOLD_KOTLINC: /opt/kotlinc/bin/kotlinc
  SEMANTIFOLD_PYTHON: /usr/bin/python3
  SEMANTIFOLD_DOTNET: /usr/bin/dotnet
  SEMANTIFOLD_GO: /usr/local/bin/go
  SEMANTIFOLD_SWIFTC: /opt/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin/swiftc
  SEMANTIFOLD_CLANG: /usr/bin/clang-21
  SEMANTIFOLD_CLANGPP: /usr/bin/clang++-21
  SEMANTIFOLD_RUSTC: /usr/local/bin/rustc
  SEMANTIFOLD_CARGO: /usr/local/bin/cargo
  SEMANTIFOLD_WASM_VALIDATE: /usr/bin/wasm-validate
  SEMANTIFOLD_CHROMIUM: /usr/local/bin/chromium
builds:
  quality:
    name: Quality and package
    script:
      - npm run lint
      - npm run typecheck
      - npm run build
      - npm audit --audit-level=high
      - npm ls --omit=dev --all
      - npm ls --all
      - npm pack --dry-run --json
  end_to_end:
    name: Thirteen-language tests with Kotlin/JVM, Rust debug/release and C/CPP O0/O2 sanitizers
    script:
      - LANG=C.UTF-8 LC_ALL=C.UTF-8 npm test
